<!doctype html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Theme Store</title>
    <style>
        :root{color-scheme:dark;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#101010;color:#eee}
        *{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#173340 0,#101010 38rem)}
        button,input{font:inherit}.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;padding:12px max(16px,calc((100% - 1200px)/2));background:rgba(15,15,15,.94);backdrop-filter:blur(12px);border-bottom:1px solid #333}
        .top a{color:#fff;text-decoration:none;padding:9px 12px;border-radius:8px;background:#292929}.top strong{font-size:18px}.wrap{max-width:1200px;margin:auto;padding:28px 18px 60px}
        .intro{display:flex;gap:20px;justify-content:space-between;align-items:end;margin-bottom:22px}.intro h1{font-size:32px;margin:0 0 6px}.muted{color:#aaa}.search{width:min(360px,100%);padding:11px 13px;border:1px solid #555;border-radius:8px;background:#1d1d1d;color:#fff}
        .notice{padding:12px 14px;border-radius:8px;margin:12px 0;background:#2b2414;border:1px solid #725d22}.error{background:#321c1c;border-color:#7e3030}.hidden{display:none!important}
        .active{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 16px;margin:16px 0;border:1px solid #176c8d;background:#102b36;border-radius:10px}.actions{display:flex;gap:8px;flex-wrap:wrap}
        .btn{border:0;border-radius:8px;padding:10px 14px;color:#fff;background:#333;cursor:pointer}.btn.primary{background:#00a4dc;color:#071216;font-weight:700}.btn.danger{background:#6d2929}.btn:disabled{opacity:.45;cursor:not-allowed}
        .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(245px,1fr));gap:18px}.card{background:#1d1d1d;border:1px solid #3a3a3a;border-radius:12px;overflow:hidden;display:flex;flex-direction:column;min-width:0}.card.selected{outline:3px solid #00a4dc}.preview{aspect-ratio:16/9;background:#292929;position:relative;overflow:hidden;cursor:pointer}.preview img{width:100%;height:100%;object-fit:cover;display:block}.count{position:absolute;right:8px;bottom:8px;padding:3px 7px;border-radius:12px;background:#000b;font-size:12px}.body{padding:14px;display:flex;flex-direction:column;gap:8px;flex:1}.body h2{font-size:18px;margin:0}.body p{font-size:13px;line-height:1.45;margin:0;color:#bbb;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.meta{font-size:12px;color:#888}.body .btn{margin-top:auto}
        .modal{position:fixed;inset:0;z-index:20;background:#000e;display:grid;place-items:center;padding:20px}.dialog{width:min(1100px,96vw);position:relative}.dialog img{display:block;max-width:100%;max-height:82vh;margin:auto;border-radius:8px}.modal .close{position:absolute;right:0;top:-48px}.nav{position:absolute;top:50%;transform:translateY(-50%);font-size:26px;background:#000a}.prev{left:8px}.next{right:8px}.caption{text-align:center;margin-top:10px}.empty{text-align:center;padding:60px 15px;color:#aaa}
        @media(max-width:650px){.intro{align-items:stretch;flex-direction:column}.grid{grid-template-columns:1fr}.active{align-items:flex-start;flex-direction:column}}
    </style>
</head>
<body>
    <header class="top"><a id="back" href="#">← Zurück</a><strong>Theme Store</strong></header>
    <main class="wrap">
        <section class="intro"><div><h1>Dein Jellyfin, dein Stil</h1><div class="muted">Diese Auswahl gilt nur für dein Jellyfin-Benutzerkonto.</div></div><input id="search" class="search" type="search" placeholder="Themes durchsuchen …" aria-label="Themes durchsuchen"></section>
        <div id="disabled" class="notice hidden">Der Administrator hat persönliche Themes deaktiviert. Es gilt der Serverstandard.</div>
        <div id="warnings"></div>
        <section id="active" class="active hidden"><div>Aktiv: <strong id="activeName"></strong><div id="defaultText" class="muted"></div></div><div class="actions"><button id="reset" class="btn danger" type="button">Serverstandard verwenden</button></div></section>
        <div id="grid" class="grid"><div class="empty">Themes werden geladen …</div></div>
    </main>
    <div id="modal" class="modal hidden" role="dialog" aria-modal="true"><div class="dialog"><button id="close" class="btn close" type="button">Schließen</button><button id="prev" class="btn nav prev" type="button" aria-label="Vorheriges Bild">‹</button><img id="large" alt="Theme-Vorschau"><button id="next" class="btn nav next" type="button" aria-label="Nächstes Bild">›</button><div id="caption" class="caption"></div></div></div>
    <script>
    (function(){
        'use strict';
        var state={themes:[],selected:'',variables:{},query:'',gallery:[],galleryIndex:0,allowed:false};
        var $=function(id){return document.getElementById(id);};
        var apiBase=new URL('.',window.location.href);
        var rootPath=window.location.pathname.replace(/ThemeStore\/Page.*$/,'');
        $('back').href=rootPath+'web/index.html#/mypreferencesmenu';

        function headers(){
            try{var creds=JSON.parse(localStorage.getItem('jellyfin_credentials')||'{}');var servers=creds.Servers||[];var current=servers.find(function(s){return s.ManualAddress&&window.location.href.indexOf(s.ManualAddress)===0;})||servers[0]||{};return current.AccessToken?{'X-Emby-Token':current.AccessToken,'X-MediaBrowser-Token':current.AccessToken}:{};}catch(e){return {};}
        }
        function request(path,options){options=options||{};options.headers=Object.assign({'Accept':'application/json'},headers(),options.headers||{});return fetch(new URL(path,apiBase),options).then(function(r){if(r.status===401){window.location.href=rootPath+'web/index.html#/login';throw new Error('Nicht angemeldet');}if(!r.ok)return r.text().then(function(t){throw new Error(t||('HTTP '+r.status));});return r;});}
        function node(tag,className,text){var n=document.createElement(tag);if(className)n.className=className;if(text!==undefined)n.textContent=text;return n;}
        function defaultLabel(data){if(data.DefaultMode==='Catalog')return data.DefaultThemeName||'Katalog-Theme';if(data.DefaultMode==='CustomCss')return 'Eigenes Server-CSS';return 'Jellyfin Standard';}
        function showError(message){var box=node('div','notice error',message);$('warnings').appendChild(box);}
        function load(){request('Catalog').then(function(r){return r.json();}).then(function(data){state.themes=data.Themes||[];state.selected=data.SelectedThemeId||'';state.variables=data.Variables||{};state.allowed=!!data.AllowUserThemes;$('disabled').classList.toggle('hidden',state.allowed);$('search').disabled=!state.allowed;$('defaultText').textContent='Serverstandard: '+defaultLabel(data);(data.Warnings||[]).forEach(showError);updateActive(data);render();}).catch(function(e){$('grid').innerHTML='';$('grid').appendChild(node('div','empty','Theme Store konnte nicht geladen werden: '+e.message));});}
        function updateActive(data){var current=state.themes.find(function(t){return t.Id===state.selected;});$('activeName').textContent=current?current.Name:defaultLabel(data);$('active').classList.remove('hidden');$('reset').classList.toggle('hidden',!state.selected||!state.allowed);}
        function render(){
            var grid=$('grid');grid.innerHTML='';var q=state.query.toLowerCase();var list=state.themes.filter(function(t){return !q||[t.Name,t.Author,t.Description,(t.Tags||[]).join(' ')].join(' ').toLowerCase().indexOf(q)>=0;});
            if(!list.length){grid.appendChild(node('div','empty','Keine passenden Themes gefunden.'));return;}
            list.forEach(function(theme){var card=node('article','card'+(theme.Id===state.selected?' selected':''));var preview=node('div','preview');var pictures=theme.PreviewUrls||[];if(pictures.length){var img=node('img');img.src=pictures[0];img.alt='Vorschau von '+theme.Name;img.loading='lazy';img.referrerPolicy='no-referrer';img.onerror=function(){this.remove();};preview.appendChild(img);if(pictures.length>1)preview.appendChild(node('span','count',pictures.length+' Bilder'));preview.addEventListener('click',function(){openGallery(theme);});}else{preview.appendChild(node('div','empty','Keine Vorschau'));}
                var body=node('div','body');body.appendChild(node('h2','',theme.Name));body.appendChild(node('div','meta',[theme.Author,theme.Version].filter(Boolean).join(' · ')));if(theme.Description)body.appendChild(node('p','',theme.Description));var button=node('button','btn primary',theme.Id===state.selected&&!(theme.Vars||[]).length?'Ausgewählt':((theme.Vars||[]).length?'Auswählen & anpassen':'Auswählen'));button.type='button';button.disabled=!state.allowed||(theme.Id===state.selected&&!(theme.Vars||[]).length);button.addEventListener('click',function(){choose(theme,button);});body.appendChild(button);card.appendChild(preview);card.appendChild(body);grid.appendChild(card);});
        }
        function choose(theme,button){var values={};var current=theme.Id===state.selected?state.variables:{};for(var i=0;i<(theme.Vars||[]).length;i++){var variable=theme.Vars[i];var initial=current[variable.Key]!==undefined?current[variable.Key]:(variable.Default||'');var answer=window.prompt((variable.Name||variable.Key)+(variable.Description?'\n'+variable.Description:''),initial);if(answer===null)return;values[variable.Key]=answer;}save(theme.Id,values,button);}
        function save(id,variables,button){button.disabled=true;button.textContent='Speichern …';request('Preference',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({ThemeId:id,Variables:variables||{}})}).then(function(){state.selected=id;state.variables=variables||{};window.dispatchEvent(new Event('theme-store:changed'));window.location.reload();}).catch(function(e){button.disabled=false;button.textContent='Auswählen';showError(e.message);});}
        function reset(){request('Preference',{method:'DELETE'}).then(function(){state.selected='';window.location.href=$('back').href;}).catch(function(e){showError(e.message);});}
        function openGallery(theme){state.gallery=theme.PreviewUrls||[];state.galleryIndex=0;$('caption').textContent=theme.Name;$('modal').classList.remove('hidden');showImage();}
        function showImage(){if(!state.gallery.length)return;$('large').src=state.gallery[state.galleryIndex];$('prev').classList.toggle('hidden',state.gallery.length<2);$('next').classList.toggle('hidden',state.gallery.length<2);}
        function move(delta){state.galleryIndex=(state.galleryIndex+delta+state.gallery.length)%state.gallery.length;showImage();}
        $('search').addEventListener('input',function(){state.query=this.value.trim();render();});$('reset').addEventListener('click',reset);$('close').addEventListener('click',function(){$('modal').classList.add('hidden');$('large').removeAttribute('src');});$('prev').addEventListener('click',function(){move(-1);});$('next').addEventListener('click',function(){move(1);});$('modal').addEventListener('click',function(e){if(e.target===this)$('close').click();});document.addEventListener('keydown',function(e){if($('modal').classList.contains('hidden'))return;if(e.key==='Escape')$('close').click();if(e.key==='ArrowLeft')move(-1);if(e.key==='ArrowRight')move(1);});load();
    })();
    </script>
</body>
</html>
