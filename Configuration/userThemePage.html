<div id="ThemeStoreUserPage" data-role="page" class="page type-interior ts-user">
  <style>
    .ts-user{min-height:calc(100vh - 3.5rem);background:radial-gradient(circle at top,#173340 0,#101010 38rem);color:#eee}
    .ts-user *{box-sizing:border-box}.ts-user button,.ts-user input{font:inherit}
    .ts-user .ts-wrap{max-width:1200px;margin:auto;padding:1.8rem 1.1rem 4rem}.ts-user .ts-intro{display:flex;gap:1.25rem;justify-content:space-between;align-items:end;margin-bottom:1.35rem}.ts-user h1{font-size:2rem;margin:0 0 .4rem}.ts-user .ts-muted{color:#aaa}.ts-user .ts-search{width:min(360px,100%);padding:.7rem .8rem;border:1px solid #555;border-radius:.5rem;background:#1d1d1d;color:#fff}
    .ts-user .ts-notice{padding:.75rem .9rem;border-radius:.5rem;margin:.75rem 0;background:#2b2414;border:1px solid #725d22}.ts-user .ts-error{background:#321c1c;border-color:#7e3030}.ts-user [hidden]{display:none!important}
    .ts-user .ts-active{display:flex;justify-content:space-between;align-items:center;gap:.75rem;padding:.9rem 1rem;margin:1rem 0;border:1px solid #176c8d;background:#102b36;border-radius:.65rem}.ts-user .ts-actions{display:flex;gap:.5rem;flex-wrap:wrap}
    .ts-user .ts-btn{border:0;border-radius:.5rem;padding:.65rem .9rem;color:#fff;background:#333;cursor:pointer}.ts-user .ts-btn-primary{background:#00a4dc;color:#071216;font-weight:700}.ts-user .ts-btn-danger{background:#6d2929}.ts-user .ts-btn:disabled{opacity:.45;cursor:not-allowed}
    .ts-user .ts-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(245px,1fr));gap:1.1rem}.ts-user .ts-card{background:#1d1d1d;border:1px solid #3a3a3a;border-radius:.75rem;overflow:hidden;display:flex;flex-direction:column;min-width:0}.ts-user .ts-card-selected{outline:3px solid #00a4dc}.ts-user .ts-preview{aspect-ratio:16/9;background:#292929;position:relative;overflow:hidden;cursor:pointer}.ts-user .ts-preview img{width:100%;height:100%;object-fit:cover;display:block}.ts-user .ts-count{position:absolute;right:.5rem;bottom:.5rem;padding:.2rem .45rem;border-radius:1rem;background:#000b;font-size:.75rem}.ts-user .ts-cardbody{padding:.9rem;display:flex;flex-direction:column;gap:.5rem;flex:1}.ts-user .ts-cardbody h2{font-size:1.1rem;margin:0}.ts-user .ts-cardbody p{font-size:.82rem;line-height:1.45;margin:0;color:#bbb;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.ts-user .ts-meta{font-size:.75rem;color:#888}.ts-user .ts-cardbody .ts-btn{margin-top:auto}
    .ts-user .ts-gallery{position:fixed;inset:0;z-index:10050;background:#000e;display:grid;place-items:center;padding:1.25rem}.ts-user .ts-dialog{width:min(1100px,96vw);position:relative}.ts-user .ts-dialog img{display:block;max-width:100%;max-height:82vh;margin:auto;border-radius:.5rem}.ts-user .ts-close{position:absolute;right:0;top:-3rem}.ts-user .ts-nav{position:absolute;top:50%;transform:translateY(-50%);font-size:1.65rem;background:#000a}.ts-user .ts-prev{left:.5rem}.ts-user .ts-next{right:.5rem}.ts-user .ts-caption{text-align:center;margin-top:.65rem}.ts-user .ts-empty{text-align:center;padding:3.5rem 1rem;color:#aaa}
    @media(max-width:650px){.ts-user .ts-intro{align-items:stretch;flex-direction:column}.ts-user .ts-grid{grid-template-columns:1fr}.ts-user .ts-active{align-items:flex-start;flex-direction:column}}
  </style>
  <main class="ts-wrap">
    <section class="ts-intro">
      <div><h1>Theme Store</h1><div class="ts-muted">Deine Auswahl gilt ausschließlich für dein Jellyfin-Benutzerkonto.</div></div>
      <input data-ts="search" class="ts-search" type="search" placeholder="Themes durchsuchen …" aria-label="Themes durchsuchen">
    </section>
    <div data-ts="disabled" class="ts-notice" hidden>Der Administrator hat persönliche Themes deaktiviert. Du kannst den Katalog ansehen, aber es gilt der Serverstandard.</div>
    <div data-ts="warnings"></div>
    <section data-ts="active" class="ts-active" hidden>
      <div>Aktiv: <strong data-ts="active-name"></strong><div data-ts="default-text" class="ts-muted"></div></div>
      <div class="ts-actions"><button data-ts="reset" class="ts-btn ts-btn-danger" type="button">Serverstandard verwenden</button></div>
    </section>
    <div data-ts="grid" class="ts-grid"><div class="ts-empty">Themes werden geladen …</div></div>
  </main>
  <div data-ts="gallery" class="ts-gallery" role="dialog" aria-modal="true" hidden>
    <div class="ts-dialog">
      <button data-ts="close-gallery" class="ts-btn ts-close" type="button">Schließen</button>
      <button data-ts="previous" class="ts-btn ts-nav ts-prev" type="button" aria-label="Vorheriges Bild">‹</button>
      <img data-ts="large-preview" alt="Theme-Vorschau">
      <button data-ts="next" class="ts-btn ts-nav ts-next" type="button" aria-label="Nächstes Bild">›</button>
      <div data-ts="caption" class="ts-caption"></div>
    </div>
  </div>
</div>
