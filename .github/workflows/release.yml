name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Test
        run: dotnet test Jellyfin.Plugin.ThemeStore.sln --configuration Release
      - name: Package
        id: package
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          dotnet publish Jellyfin.Plugin.ThemeStore.csproj --configuration Release --no-restore --output publish -p:Version="${version}" -p:RepositoryUrl="https://github.com/${GITHUB_REPOSITORY}"
          archive="ThemeStore_${version}.zip"
          (cd publish && zip -j "../${archive}" Jellyfin.Plugin.ThemeStore.dll)
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "archive=${archive}" >> "$GITHUB_OUTPUT"
          echo "checksum=$(md5sum "${archive}" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: Theme Store v${{ steps.package.outputs.version }}
          generate_release_notes: true
          files: ${{ steps.package.outputs.archive }}
      - name: Update Jellyfin repository manifest
        env:
          VERSION: ${{ steps.package.outputs.version }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
          CHECKSUM: ${{ steps.package.outputs.checksum }}
        shell: bash
        run: |
          git checkout main
          git pull --ff-only origin main
          export TIMESTAMP="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          export SOURCE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}/${ARCHIVE}"
          export IMAGE_URL="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/assets/skinmanager.svg"
          python3 .github/scripts/update_manifest.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add manifest.json
          git commit -m "chore: update plugin manifest for v${VERSION}" || exit 0
          git push origin main
